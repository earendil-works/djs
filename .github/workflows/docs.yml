# Publishes the guide (docs/guide, D2100) to GitHub Pages: `djs-docs build` renders the
# pages and copies djs-wasm and the host package (types stripped by
# node) for the live examples. The gate already runs `djs-docs check` before anything
# reaches main, so this only builds and deploys. The deploy step is retried once after a
# short wait: deploy-pages can fail transiently ("Failed to get ID Token … socket hang up").
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but a running deployment
# finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # strip.mjs needs node:module's stripTypeScriptTypes (node >= 22.13).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The docs build of djs-wasm: the shipping module plus `djs_disasm` for the live
      # examples' Bytecode tab and the dumper for their Dump tab (target/docs-wasm, picked
      # up by `djs-docs build`).
      - name: Build djs-wasm (live examples)
        run: scripts/build-wasm.sh --docs
      - name: Build the site
        run: cargo run -q -p djs-docs -- build --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # The first attempt may fail transiently; the job then fails only if the retry does.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
