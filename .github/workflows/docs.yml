# Publishes the guide (docs/guide, D2100) to GitHub Pages: `djs-docs build` renders the
# pages and the decision log, and copies djs-wasm and the host package (types stripped by
# node) for the live examples. The gate already runs `djs-docs check` before anything
# reaches main, so this only builds and deploys.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but a running deployment
# finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # strip.mjs needs node:module's stripTypeScriptTypes (node >= 22.13).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build djs-wasm (live examples)
        run: scripts/build-wasm.sh
      - name: Build the site
        run: cargo run -q -p djs-docs -- build --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
