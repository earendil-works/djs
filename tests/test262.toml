# test262 grouping for djs. See TESTING.md ("Groups: skip / later / active").
#
# Every test belongs to exactly one group. Groups are checked in order and the first
# one with a matching rule wins; tests that match no group are `active`.
#
#   kind = "skip"   never run; excluded from the score (non-goals)
#   kind = "later"  run and reported separately (on the roadmap, not this milestone)
#
# Rules (a test matches a group if any rule matches):
#   flags     the test has one of these frontmatter flags
#   paths     directory prefixes or files, relative to test/, or globs (`*` within a
#             segment, `**` across)
#   features  feature globs (`*`), matched against the test's features plus the ones
#             implied by its includes (harness/features.yml)
#   scan      literal patterns searched in the test and its includes, outside comments,
#             not preceded by an identifier character
#
# Moving tests from `later` to active is a coordinator decision (TESTING.md).

[[group]]
name = "skip"
kind = "skip"
description = "Non-goals from ARCH.md: never implemented."
flags = [
  "noStrict",         # djs is always strict
  "CanBlockIsFalse",  # agent blocking semantics only matter with Atomics
  "CanBlockIsTrue",   # same
]
paths = [
  "intl402",                       # Intl is a non-goal
  "annexB",                        # legacy web-compat semantics, mostly sloppy mode
  "staging",                       # proposals and imported engine tests, not stable
  "built-ins/Temporal",            # Temporal is a non-goal
  "built-ins/SharedArrayBuffer",   # no shared memory
  "built-ins/Atomics",             # no shared memory
  "built-ins/ShadowRealm",         # no realms
  "built-ins/AbstractModuleSource", # source phase imports (modules)
  "language/comments/hashbang/use-strict.js", # raw test that needs sloppy mode (`with`)
]
features = [
  "Intl-*",                      # Intl is a non-goal
  "Intl.*",                      # Intl is a non-goal
  "intl-normative-optional",     # Intl is a non-goal
  "Temporal",                    # Temporal is a non-goal
  "SharedArrayBuffer",           # no shared memory
  "Atomics*",                    # no shared memory (Atomics, Atomics.pause, Atomics.waitAsync)
  "ShadowRealm",                 # no realms
  "tail-call-optimization",      # not planned (needs a different call design)
  "IsHTMLDDA",                   # browser-only document.all semantics
  "cross-realm",                 # no $262.createRealm
  "caller",                      # sloppy-mode function.caller
  "legacy-regexp",               # RegExp.$1 and friends (Annex B)
  "__getter__",                  # __defineGetter__ / __lookupGetter__ (Annex B)
  "__setter__",                  # __defineSetter__ / __lookupSetter__ (Annex B)
  "import-*",                    # import attributes/defer/text/bytes: not implemented
  "json-modules",                # JSON modules: not implemented (needs import attributes)
  "source-phase-imports*",       # source phase imports: not implemented
  "top-level-await",             # not implemented yet (0248)
  "host-gc-required",            # needs a real $262.gc
]
scan = [
  "$262.createRealm(",  # a few realm tests lack the cross-realm feature tag
]

[[group]]
name = "direct-eval"
kind = "skip"
description = "Direct eval: access to the caller's scope is a non-goal (D014). djs treats `eval(x)` as indirect eval, so tests of direct eval semantics cannot pass. Indirect eval and the Function constructors are active since 0059."
paths = [
  "language/eval-code/direct",  # all about direct eval
]
scan = [
  "eval(",  # a direct eval call (and obj.eval(...), conservatively; `(0, eval)(` does not match)
]

[[group]]
name = "later"
kind = "later"
description = "Phases P3 to P5 of ARCH.md: on the roadmap, not in the current milestone."
# Moved to active in 0061: the feature json-parse-with-source.
# Moved to active in 0050 (RegExp completion): built-ins/RegExp,
# RegExpStringIteratorPrototype, language/literals/regexp, and the features regexp-*,
# RegExp.escape, String.prototype.matchAll and Symbol.match/matchAll/replace/search/split.
# Moved to active by the coordinator in 0038: built-ins/Reflect, Map, Set, WeakMap,
# WeakSet, their iterator prototypes, Symbol and Date, and the features Reflect,
# Reflect.*, Map, Set, set-methods, array-grouping, WeakMap, WeakSet,
# symbols-as-weakmap-keys, Symbol.species, Symbol.toPrimitive, Symbol.toStringTag,
# Symbol.isConcatSpreadable, Symbol.hasInstance and Symbol.prototype.description.
# Moved to active in 0039: built-ins/ArrayBuffer, DataView, TypedArray,
# TypedArrayConstructors, Uint8Array and the features TypedArray, TypedArray.*, *Array,
# ArrayBuffer, DataView, DataView.*, resizable-arraybuffer, arraybuffer-transfer,
# align-detached-buffer-semantics-with-web-reality, uint8array-base64 and
# stable-typedarray-sort (immutable-arraybuffer stays later: a proposal).
# Moved to active in 0045: built-ins/Proxy and the features Proxy, proxy-missing-checks.
# Moved to active in 0058: the `using` and `await using` declarations
# (language/statements/using, await-using, and the for-of/for-await-of using heads).
# Moved to active in 0051: built-ins/Iterator and the features iterator-helpers,
# iterator-sequencing, iterator-chunking, iterator-includes, Iterator.prototype.join,
# joint-iteration, upsert, Array.fromAsync, and built-ins/DisposableStack,
# AsyncDisposableStack, SuppressedError with the runtime half of the feature
# explicit-resource-management, and
# built-ins/WeakRef, FinalizationRegistry with the features WeakRef, FinalizationRegistry,
