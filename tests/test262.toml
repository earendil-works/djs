# Moved to active in 0065: the feature decorators (the decorator syntax tests and the
# `accessor` fields).
# Moved to active in 0097 (the group is empty now): immutable-arraybuffer (D1970),
# error-stack-accessor (D1971), await-dictionary (D1972) and Symbol.unscopables (its
# tests passed already; the `with` ones stay skipped).
paths = [
]
features = [
]
