[package]
name = "djs-difftest"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
# `cargo run -p djs-difftest` (scripts, the gate) runs the difftest, not djs-abidrive.
default-run = "djs-difftest"

[lib]
# No doctests (scripts/gate.py `targets` fails if one appears): none to compile (0197).
doctest = false

[[bin]]
name = "djs-difftest"
# No unit tests in the program (scripts/gate.py `targets` checks): no empty test binary (0197).
test = false
path = "src/main.rs"

[[bin]]
name = "djs-abidrive"
# No unit tests in the program (scripts/gate.py `targets` checks): no empty test binary (0197).
test = false
path = "src/bin/djs-abidrive.rs"

[features]
default = ["unicode"]
# djs-core's Unicode tables.
unicode = ["djs-prelude/unicode", "djs-wasm/unicode", "djs-test262/unicode"]

[dependencies]
djs-core = { path = "../djs-core", default-features = false }
# The base image: VMs start as a copy, not a prelude compile (D1321).
djs-prelude = { path = "../djs-prelude", default-features = false, features = ["raw"] }
# The wasm export layer, driven natively by djs-abidrive to compare images with the wasm
# build (0072).
djs-wasm = { path = "../djs-wasm", default-features = false }
# Shared runner utilities (parallel map, ratchet file, globs, tables); see D1101.
djs-test262 = { path = "../djs-test262", default-features = false }
