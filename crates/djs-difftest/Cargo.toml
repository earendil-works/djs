[package]
name = "djs-difftest"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
# `cargo run -p djs-difftest` (scripts, the gate) runs the difftest, not djs-abidrive.
default-run = "djs-difftest"

[[bin]]
name = "djs-difftest"
path = "src/main.rs"

[[bin]]
name = "djs-abidrive"
path = "src/bin/djs-abidrive.rs"

[dependencies]
djs-core = { path = "../djs-core" }
# The base snapshot: VMs start as a copy, not a prelude compile (D1321).
djs-prelude = { path = "../djs-prelude" }
# The wasm export layer, driven natively by djs-abidrive to compare images with the wasm
# build (0072).
djs-wasm = { path = "../djs-wasm" }
# Shared runner utilities (parallel map, ratchet file, globs, tables); see D1101.
djs-test262 = { path = "../djs-test262" }
