[package]
name = "djs-bench"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doctests (scripts/gate.py `targets` fails if one appears): none to compile (0197).
doctest = false

[[bin]]
name = "djs-bench"
# No unit tests in the program (scripts/gate.py `targets` checks): no empty test binary (0197).
test = false
path = "src/main.rs"

[dependencies]
djs-core = { path = "../djs-core" }
# The startup group compares VMs from the base snapshot with compiling the prelude.
djs-prelude = { path = "../djs-prelude" }
# The engine track runs cases in difftest's codemode model through its Engine trait (D1191).
djs-difftest = { path = "../djs-difftest" }
