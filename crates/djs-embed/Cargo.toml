[package]
name = "djs-embed"
# Unpublished: its API changes with djs (D3645), like every crate of the workspace.
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Embed djs in a Rust host: compiled images, typed host functions, async calls, budgets."

[lib]
# No doctests (scripts/gate.py `targets` fails if one appears): the examples in the docs
# are `ignore` blocks, and tests/it/example.rs runs the same code.
doctest = false

[features]
default = ["unicode"]
# djs-core's Unicode tables (`\p{..}` in regular expressions, `String.prototype.normalize`):
# about 60 KB of native code.
unicode = ["djs-core/unicode", "djs-prelude/unicode"]

[dependencies]
# `embed`: the additions for Rust hosts (D3180).
djs-core = { path = "../djs-core", default-features = false, features = ["embed"] }
djs-prelude = { path = "../djs-prelude", default-features = false, features = ["raw", "embed"] }
