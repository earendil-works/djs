[package]
name = "djs-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "djs"
path = "src/main.rs"

[features]
default = ["unicode"]
# djs-core's Unicode tables.
unicode = ["djs-prelude/unicode"]

[dependencies]
# `dump`: the REPL's .dump (0167).
djs-core = { path = "../djs-core", default-features = false, features = ["dump"] }
# The base snapshot: VMs start as a copy, not a prelude compile (D1321).
djs-prelude = { path = "../djs-prelude", default-features = false, features = ["raw", "registry", "names"] }
