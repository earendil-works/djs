[package]
name = "djs-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "djs"
path = "src/main.rs"

[dependencies]
djs-core = { path = "../djs-core" }
# The base snapshot: VMs start as a copy, not a prelude compile (D1321).
djs-prelude = { path = "../djs-prelude" }
# `djs heap`: snapshot containers are zstd frames against a reference image (D2260); the
# C library is the only decoder that takes raw-content dictionaries (D2264).
zstd = { version = "0.13", default-features = false }
