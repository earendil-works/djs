[package]
name = "djs-docs"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "The guide (docs/guide): generated regions, checks and the static site (0103, D2100)."

[[bin]]
name = "djs-docs"
path = "src/main.rs"

[dependencies]
djs-core = { path = "../djs-core" }
# Examples run in a VM made from the base snapshot, as `djs run` does.
djs-prelude = { path = "../djs-prelude" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
