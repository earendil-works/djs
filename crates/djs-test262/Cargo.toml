[package]
name = "djs-test262"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doctests (scripts/gate.py `targets` fails if one appears): none to compile (0197).
doctest = false

[[bin]]
name = "djs-test262"
# No unit tests in the program (scripts/gate.py `targets` checks): no empty test binary (0197).
test = false
path = "src/main.rs"

[features]
default = ["full", "unicode", "lazy"]
# djs-core's features (D2411): `--no-default-features` builds against the slim engine.
full = ["djs-prelude/full"]
unicode = ["djs-prelude/unicode"]
# `--lazy`: lazy functions (D2990).
lazy = ["djs-core/lazy"]

[dependencies]
djs-core = { path = "../djs-core", default-features = false }
# The base snapshot: VMs start as a copy, not a prelude compile (D1321).
djs-prelude = { path = "../djs-prelude", default-features = false, features = ["raw", "registry"] }
