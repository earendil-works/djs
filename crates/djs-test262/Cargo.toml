[package]
name = "djs-test262"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doctests (scripts/gate.py `targets` fails if one appears): none to compile (0197).
doctest = false

[[bin]]
name = "djs-test262"
# No unit tests in the program (scripts/gate.py `targets` checks): no empty test binary (0197).
test = false
path = "src/main.rs"

[features]
default = ["unicode", "embed"]
# djs-core's Unicode tables.
unicode = ["djs-prelude/unicode"]
# djs-core's `embed` (D3175): ES modules, for the `flags: [module]` tests. djs-difftest
# builds this crate without it, so its engine stays the wasm modules' feature set.
embed = ["djs-prelude/embed"]

[dependencies]
djs-core = { path = "../djs-core", default-features = false }
# The base snapshot: VMs start as a copy, not a prelude compile (D1321).
djs-prelude = { path = "../djs-prelude", default-features = false, features = ["raw"] }
