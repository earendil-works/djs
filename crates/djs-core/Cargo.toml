[package]
name = "djs-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doctests (scripts/gate.py `targets` fails if one appears): none to compile (0197).
doctest = false

[dependencies]
# Math (D3174): libm 0.2.16's functions; its sources are hashed into BUILD_HASH (build.rs).
djs-libm = { path = "../djs-libm" }

[features]
default = ["unicode", "embed", "snapshot"]
# Logical snapshots (0300, 0301, D3700): `Vm::snapshot`/`Vm::from_snapshot`, a waiting VM
# as a graph of named-field records keyed by bytecode hashes: djs's persistence format.
# Code only (not in the build hash).
snapshot = ["intrinsic-names"]
# What Rust hosts (djs-embed) use beyond the wasm modules' needs (D3175, D3180): the
# outbound wire encoder (`wire::encode`), the wire format's uncounted UTF-8 strings,
# `ExecOptions::fatal_out_of_memory`, and ES modules (D3171: the module goal, the loader,
# linking and evaluation, `Vm::load_module`). Off in djs-wasm's modules, whose size counts
# (D020). An image feature: the base of a build without it leaves out the builtins tagged
# `// @embed-only` (builtins/gen/prelude-noembed.js).
embed = ["djs-prelude/embed"]
# Running the prelude source in wasm (D3094): `Vm::new` with `VmOptions::prelude` and the
# `%Install*` intrinsics the prelude calls. Native builds always have it; wasm modules
# start from the base image and leave it out unless they need it (djs-wasm's
# `compiled-prelude`). Code only.
prelude = []
# The intrinsics' names in wasm builds without `prelude` (D3340): for the disassembler of
# the docs module. Code only.
intrinsic-names = []
# The Unicode tables: both features below.
unicode = ["regexp-unicode-props", "unicode-normalization"]
# (Each feature also turns on djs-prelude's of the same name, for the e2e tests' base: the
# base must come from a djs-core with the same features.)
# `\p{..}` / `\P{..}` in regular expressions: about 21 KB of Unicode property tables
# (D1500). Without it they are a SyntaxError (D1112).
regexp-unicode-props = ["djs-prelude/regexp-unicode-props"]
# The tables of `regexp-unicode-props` and `unicode-normalization` not built in (D3350):
# the shipped wasm module carries them outside its linear memory and its host hands them
# over at their first use (`Vm::set_tables`). Changes no result or image.
cold-unicode = []
# String.prototype.normalize for every string, and localeCompare normalizing to NFC like
# qjs: about 38 KB (20 KB gzipped) of wasm (D1760). Without it normalize throws for strings that would
# need them, and localeCompare compares code points.
unicode-normalization = ["djs-prelude/unicode-normalization"]
# Unchecked arena field access (D2520): heap/layout/access.rs reads and writes without a
# bounds check (debug builds still assert it). Off by default; the gate runs both builds.
unsafe-heap = []

[dev-dependencies]
# e2e tests start from the base snapshot like the embedders (a dev-dependency cycle,
# which cargo allows: integration tests link the same djs-core).
djs-prelude = { path = "../djs-prelude", default-features = false, features = ["raw"] }
