[package]
name = "djs-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libm = "0.2.16"

[features]
default = ["regexp-unicode-props"]
# `\p{..}` / `\P{..}` in regular expressions: about 58 KB of Unicode property tables
# (D1500). Without it they are a SyntaxError (D1112).
regexp-unicode-props = []

[dev-dependencies]
# e2e tests start from the base snapshot like the embedders (a dev-dependency cycle,
# which cargo allows: integration tests link the same djs-core).
djs-prelude = { path = "../djs-prelude" }
