[package]
name = "djs-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "The wasm32 export layer over djs-core's Vm (docs/host.md)."

[lib]
# No doctests (scripts/gate.py `targets` fails if one appears): none to compile (0197).
doctest = false
# cdylib: the .wasm module; rlib: so native unit tests can call the exports.
crate-type = ["cdylib", "rlib"]

[features]
default = ["full", "unicode"]
# djs-core's features (D2411); without `full` this is the slim module
# (`scripts/build-wasm.sh --slim`, djs-slim.wasm).
full = ["djs-prelude/full"]
unicode = ["djs-prelude/unicode"]
# Exports `vm_new_compiled` (Vm::new: builds the realm and compiles the prelude), for
# checking the base snapshot in wasm. Off by default, so release modules do not carry
# the prelude source next to its compiled base. The gate's debug build turns it on.
compiled-prelude = ["djs-core/prelude"]
# Exports `djs_alloc_stats`: live and peak bytes of Rust heap allocations and their count,
# through a counting wrapper around the system allocator (memory accounting, 0094).
alloc-stats = []
# Exports `djs_disasm` (bytecode listings) for the docs site's live examples (0113).
# Off by default: the shipping module does not carry the disassembler.
docs = []
# Exports `vm_dump` (`Vm::dump`, 0167): a VM's bindings written as JavaScript. Off by
# default: it costs the module 58 KB gzip (D2352); the gate's debug build turns it on.
dump = ["djs-core/dump", "djs-core/lazy", "djs-core/compile-cache", "djs-prelude/names"]
# Unchecked arena field access in djs-core (D2520); off in the shipped module.
unsafe-heap = ["djs-core/unsafe-heap"]

[dependencies]
djs-core = { path = "../djs-core", default-features = false }
# The base snapshot: vm_new copies it (D1321).
# The base snapshot, coded (D2252): vm_new copies it after a decode once per instance.
djs-prelude = { path = "../djs-prelude", default-features = false, features = ["packed"] }

# On wasm32 the crate is no_std (D2332): std's allocator for that target, named directly,
# under the page manager of allocator.rs (D2053).
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = "0.2.14"

[dev-dependencies]
# The page allocator's native tests run dlmalloc over a fake memory.
dlmalloc = "0.2.14"
