<svg xmlns="http://www.w3.org/2000/svg" class="dg-cell-Interp" viewBox="0 0 580 566" width="580" height="566" role="img" aria-label="Layout of the Interp cell">
<title>Layout of the Interp cell</title>
<style>
  .dg-cell-Interp text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-cell-Interp .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-cell-Interp .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-cell-Interp .label { font-weight: 600; }
  .dg-cell-Interp .title { font-weight: 600; font-size: 13px; }
  .dg-cell-Interp .box, .dg-cell-Interp .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-cell-Interp .hdr, .dg-cell-Interp .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-cell-Interp .traced, .dg-cell-Interp .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-cell-Interp .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-cell-Interp .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-cell-Interp .pad { fill: url(#cell-Interp-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-cell-Interp .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-cell-Interp .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-cell-Interp .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-cell-Interp .opt { stroke-dasharray: 3 2; }
  .dg-cell-Interp .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-cell-Interp .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-cell-Interp .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#cell-Interp-a); }
  .dg-cell-Interp .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#cell-Interp-a); }
  .dg-cell-Interp .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-cell-Interp .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  @media (prefers-color-scheme: dark) {
    .dg-cell-Interp text { fill: var(--semantic-color-text-primary, #f6f6f6); }
    .dg-cell-Interp .small { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Interp .box, .dg-cell-Interp .host { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cell-Interp .hdr, .dg-cell-Interp .engine { fill: var(--semantic-color-background-fill-secondary-information, #1e313b); stroke: var(--semantic-color-border-information, #4c9bc1); }
    .dg-cell-Interp .traced, .dg-cell-Interp .arena { fill: var(--semantic-color-background-fill-secondary-warning, #3b2b0c); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-cell-Interp .tag { fill: var(--semantic-color-background-fill-secondary-positive, #1f3328); stroke: var(--semantic-color-border-positive, #4da578); }
    .dg-cell-Interp .cell { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-cell-Interp .pad { stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-cell-Interp .tail { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cell-Interp .zero { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cell-Interp .dead { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-cell-Interp .rule { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Interp .dash { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Interp .arrow { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Interp .faint { stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cell-Interp .head { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Interp .hatch { stroke: var(--semantic-color-border-secondary, #464646); }
  }
</style>
<defs><pattern id="cell-Interp-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern><marker id="cell-Interp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
