  .dg-chart-engines-dumps .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-engines-dumps .pad { fill: url(#chart-engines-dumps-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-engines-dumps .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-engines-dumps .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
