<svg xmlns="http://www.w3.org/2000/svg" class="dg-chart-engines-dumps" viewBox="0 0 720 204" width="720" height="204" role="img" aria-labelledby="chart-engines-dumps-t chart-engines-dumps-d">
<title id="chart-engines-dumps-t">djs's continuation dumps per workload: size, and the time to write and to load one</title>
<desc id="chart-engines-dumps-d">Horizontal bars per workload: the median dump size in KiB on a logarithmic scale, the median write and load times in ms. A workload that never waits has no dump. The table below has the exact numbers.</desc>
<style>
  .dg-chart-engines-dumps text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-chart-engines-dumps .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-chart-engines-dumps .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-engines-dumps .label { font-weight: 600; }
  .dg-chart-engines-dumps .title { font-weight: 600; font-size: 13px; }
  .dg-chart-engines-dumps .box, .dg-chart-engines-dumps .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-chart-engines-dumps .hdr, .dg-chart-engines-dumps .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-chart-engines-dumps .traced, .dg-chart-engines-dumps .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
