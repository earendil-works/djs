<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 196" width="768" height="196" role="img" aria-label="The two encodings of a 64-bit djs value">
<title>The two encodings of a 64-bit djs value</title>
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #1f2328; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .small { font-size: 10px; fill: #59636e; }
  .label { font-weight: 600; }
  .box { fill: #f6f8fa; stroke: #8c959f; }
  .hdr { fill: #ddf4ff; stroke: #54aeff; }
  .traced { fill: #fff1e5; stroke: #fb8f44; }
  .tag { fill: #fbefff; stroke: #c297ff; }
  .pad { fill: url(#hatch); stroke: #d0d7de; }
  .tail { fill: #f6f8fa; stroke: #8c959f; stroke-dasharray: 4 3; }
  .opt { stroke-dasharray: 3 2; }
  .rule { stroke: #8c959f; }
  .hatch { stroke: #d0d7de; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .small { fill: #9198a1; }
    .box, .tail { fill: #161b22; stroke: #6e7681; }
    .hdr { fill: #0c2d6b; stroke: #388bfd; }
    .traced { fill: #3d1d00; stroke: #db6d28; }
    .tag { fill: #2b1a4a; stroke: #a371f7; }
    .pad { stroke: #30363d; }
    .rule { stroke: #6e7681; }
    .hatch { stroke: #30363d; }
  }
</style>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern></defs>
<text class="label" x="8" y="46" text-anchor="start">Number</text>
<text class="small" x="8" y="60" text-anchor="start">(any other bits)</text>
<rect class="box" x="112" y="28" width="10" height="34" rx="3"/>
<text class="mono" x="117" y="43" text-anchor="middle">s</text>
<text class="small" x="117" y="56" text-anchor="middle"></text>
<rect class="box" x="122" y="28" width="110" height="34" rx="3"/>
<text class="mono" x="177" y="43" text-anchor="middle">exponent</text>
<text class="small" x="177" y="56" text-anchor="middle">11 bits</text>
<rect class="box" x="232" y="28" width="520" height="34" rx="3"/>
<text class="mono" x="492" y="43" text-anchor="middle">fraction</text>
<text class="small" x="492" y="56" text-anchor="middle">52 bits</text>
<text class="label" x="8" y="106" text-anchor="start">Tagged</text>
<text class="small" x="8" y="120" text-anchor="start">(top 16 = 0xFFF8)</text>
<rect class="tag" x="112" y="88" width="160" height="34" rx="3"/>
<text class="mono" x="192" y="103" text-anchor="middle">0xFFF8</text>
<text class="small" x="192" y="116" text-anchor="middle">quiet NaN, sign set</text>
<rect class="tag" x="272" y="88" width="160" height="34" rx="3"/>
<text class="mono" x="352" y="103" text-anchor="middle">tag</text>
<text class="small" x="352" y="116" text-anchor="middle">1–6 immediate, ≥ 8 reference</text>
<rect class="traced" x="432" y="88" width="320" height="34" rx="3"/>
<text class="mono" x="592" y="103" text-anchor="middle">payload</text>
<text class="small" x="592" y="116" text-anchor="middle">immediate bits or u32 arena offset</text>
<line class="rule" x1="112" y1="16" x2="112" y2="26"/>
<text class="small mono" x="112" y="13" text-anchor="middle">63</text>
<line class="rule" x1="262" y1="16" x2="262" y2="26"/>
<text class="small mono" x="262" y="13" text-anchor="middle">48</text>
<line class="rule" x1="422" y1="16" x2="422" y2="26"/>
<text class="small mono" x="422" y="13" text-anchor="middle">32</text>
<line class="rule" x1="752" y1="16" x2="752" y2="26"/>
<text class="small mono" x="752" y="13" text-anchor="middle">0</text>
<path class="rule" fill="none" d="M113 140 v6 H430 v-6"/>
<path class="rule" fill="none" d="M434 140 v6 H751 v-6"/>
<text class="small" x="272" y="162" text-anchor="middle">hi word: <tspan class="mono">hi &gt;&gt;&gt; 16 === 0xFFF8</tspan> means tagged</text>
<text class="small" x="592" y="162" text-anchor="middle">lo word: the payload</text>
<text class="small" x="112" y="186" text-anchor="start">Every NaN is stored as 0x7FF8_0000_0000_0000, so no Number can look like a tagged value.</text>
</svg>
