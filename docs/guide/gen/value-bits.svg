<svg xmlns="http://www.w3.org/2000/svg" class="dg-value-bits" viewBox="0 0 768 196" width="768" height="196" role="img" aria-label="The two encodings of a 64-bit djs value">
<title>The two encodings of a 64-bit djs value</title>
<style>
  .dg-value-bits text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-value-bits .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-value-bits .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-value-bits .label { font-weight: 600; }
  .dg-value-bits .title { font-weight: 600; font-size: 13px; }
  .dg-value-bits .box, .dg-value-bits .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-value-bits .hdr, .dg-value-bits .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-value-bits .traced, .dg-value-bits .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-value-bits .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-value-bits .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-value-bits .pad { fill: url(#value-bits-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-value-bits .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-value-bits .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-value-bits .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-value-bits .opt { stroke-dasharray: 3 2; }
  .dg-value-bits .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-value-bits .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-value-bits .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#value-bits-a); }
  .dg-value-bits .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#value-bits-a); }
  .dg-value-bits .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-value-bits .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  @media (prefers-color-scheme: dark) {
    .dg-value-bits text { fill: var(--semantic-color-text-primary, #f6f6f6); }
    .dg-value-bits .small { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-value-bits .box, .dg-value-bits .host { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-value-bits .hdr, .dg-value-bits .engine { fill: var(--semantic-color-background-fill-secondary-information, #1e313b); stroke: var(--semantic-color-border-information, #4c9bc1); }
    .dg-value-bits .traced, .dg-value-bits .arena { fill: var(--semantic-color-background-fill-secondary-warning, #3b2b0c); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-value-bits .tag { fill: var(--semantic-color-background-fill-secondary-positive, #1f3328); stroke: var(--semantic-color-border-positive, #4da578); }
    .dg-value-bits .cell { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-value-bits .pad { stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-value-bits .tail { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-value-bits .zero { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-value-bits .dead { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-value-bits .rule { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-value-bits .dash { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-value-bits .arrow { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-value-bits .faint { stroke: var(--semantic-color-border-primary, #919191); }
    .dg-value-bits .head { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-value-bits .hatch { stroke: var(--semantic-color-border-secondary, #464646); }
  }
</style>
<defs><pattern id="value-bits-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern><marker id="value-bits-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<text class="label" x="8" y="46" text-anchor="start">Number</text>
<text class="small" x="8" y="60" text-anchor="start">(any other bits)</text>
<rect class="box" x="112" y="28" width="10" height="34" rx="3"/>
<text class="mono" x="117" y="43" text-anchor="middle">s</text>
<text class="small" x="117" y="56" text-anchor="middle"></text>
<rect class="box" x="122" y="28" width="110" height="34" rx="3"/>
<text class="mono" x="177" y="43" text-anchor="middle">exponent</text>
<text class="small" x="177" y="56" text-anchor="middle">11 bits</text>
<rect class="box" x="232" y="28" width="520" height="34" rx="3"/>
<text class="mono" x="492" y="43" text-anchor="middle">fraction</text>
<text class="small" x="492" y="56" text-anchor="middle">52 bits</text>
<text class="label" x="8" y="106" text-anchor="start">Tagged</text>
<text class="small" x="8" y="120" text-anchor="start">(top 16 = 0xFFF8)</text>
<rect class="tag" x="112" y="88" width="160" height="34" rx="3"/>
<text class="mono" x="192" y="103" text-anchor="middle">0xFFF8</text>
<text class="small" x="192" y="116" text-anchor="middle">quiet NaN, sign set</text>
<rect class="tag" x="272" y="88" width="160" height="34" rx="3"/>
<text class="mono" x="352" y="103" text-anchor="middle">tag</text>
<text class="small" x="352" y="116" text-anchor="middle">1–6 immediate, ≥ 8 reference</text>
<rect class="traced" x="432" y="88" width="320" height="34" rx="3"/>
<text class="mono" x="592" y="103" text-anchor="middle">payload</text>
<text class="small" x="592" y="116" text-anchor="middle">immediate bits or u32 arena offset</text>
<line class="rule" x1="112" y1="16" x2="112" y2="26"/>
<text class="small mono" x="112" y="13" text-anchor="middle">63</text>
<line class="rule" x1="262" y1="16" x2="262" y2="26"/>
<text class="small mono" x="262" y="13" text-anchor="middle">48</text>
<line class="rule" x1="422" y1="16" x2="422" y2="26"/>
<text class="small mono" x="422" y="13" text-anchor="middle">32</text>
<line class="rule" x1="752" y1="16" x2="752" y2="26"/>
<text class="small mono" x="752" y="13" text-anchor="middle">0</text>
<path class="rule" fill="none" d="M113 140 v6 H430 v-6"/>
<path class="rule" fill="none" d="M434 140 v6 H751 v-6"/>
<text class="small" x="272" y="162" text-anchor="middle">hi word: <tspan class="mono">hi &gt;&gt;&gt; 16 === 0xFFF8</tspan> means tagged</text>
<text class="small" x="592" y="162" text-anchor="middle">lo word: the payload</text>
<text class="small" x="112" y="186" text-anchor="start">Every NaN is stored as 0x7FF8_0000_0000_0000, so no Number can look like a tagged value.</text>
</svg>
