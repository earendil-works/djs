<svg xmlns="http://www.w3.org/2000/svg" class="dg-chart-engines-memory" viewBox="0 0 720 274" width="720" height="274" role="img" aria-labelledby="chart-engines-memory-t chart-engines-memory-d">
<title id="chart-engines-memory-t">Linear memory after the run per workload and engine, in MiB on a logarithmic scale</title>
<desc id="chart-engines-memory-d">Grouped columns: one group per workload, one column per engine, lower is better. The table below has the exact numbers.</desc>
<style>
  .dg-chart-engines-memory text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-chart-engines-memory .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-chart-engines-memory .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-engines-memory .label { font-weight: 600; }
  .dg-chart-engines-memory .title { font-weight: 600; font-size: 13px; }
  .dg-chart-engines-memory .box, .dg-chart-engines-memory .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-chart-engines-memory .hdr, .dg-chart-engines-memory .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-chart-engines-memory .traced, .dg-chart-engines-memory .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-engines-memory .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-chart-engines-memory .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-engines-memory .pad { fill: url(#chart-engines-memory-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-engines-memory .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-engines-memory .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-engines-memory .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-chart-engines-memory .opt { stroke-dasharray: 3 2; }
  .dg-chart-engines-memory .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-chart-engines-memory .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-engines-memory .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#chart-engines-memory-a); }
  .dg-chart-engines-memory .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#chart-engines-memory-a); }
  .dg-chart-engines-memory .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-engines-memory .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-engines-memory .grid { stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-width: 1; }
  .dg-chart-engines-memory .axis { stroke: var(--semantic-color-border-primary, #777777); stroke-width: 1; }
  .dg-chart-engines-memory .parity { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-engines-memory .faster { fill: var(--semantic-color-background-fill-primary-positive, #2e6c4c); }
  .dg-chart-engines-memory .slower { fill: var(--semantic-color-background-fill-primary-negative, #a42c2d); }
  .dg-chart-engines-memory .s0 { fill: var(--semantic-color-background-fill-data-viz-100, #557ca7); }
  .dg-chart-engines-memory .s1 { fill: var(--semantic-color-background-fill-data-viz-200, #e98a2e); }
  .dg-chart-engines-memory .s2 { fill: var(--semantic-color-background-fill-data-viz-300, #d5525a); }
  .dg-chart-engines-memory .s3 { fill: var(--semantic-color-background-fill-data-viz-400, #80b9b2); }
  .dg-chart-engines-memory .s4 { fill: var(--semantic-color-background-fill-data-viz-500, #66a14f); }
  .dg-chart-engines-memory .s5 { fill: var(--semantic-color-background-fill-data-viz-600, #e9c74c); }
  .dg-chart-engines-memory .s6 { fill: var(--semantic-color-background-fill-data-viz-700, #aa7aa0); }
  .dg-chart-engines-memory .s7 { fill: var(--semantic-color-background-fill-data-viz-800, #f79ba8); }
  .dg-chart-engines-memory .s8 { fill: var(--semantic-color-background-fill-data-viz-900, #98745e); }
  .dg-chart-engines-memory .s9 { fill: var(--semantic-color-background-fill-data-viz-1000, #b9b0ab); }
