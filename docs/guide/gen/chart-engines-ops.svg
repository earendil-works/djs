  .dg-chart-engines-ops .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-engines-ops .label { font-weight: 600; }
  .dg-chart-engines-ops .title { font-weight: 600; font-size: 13px; }
