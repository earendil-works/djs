    .dg-chart-engines-ops .s5 { fill: var(--semantic-color-background-fill-data-viz-600, #e9c74c); }
    .dg-chart-engines-ops .s6 { fill: var(--semantic-color-background-fill-data-viz-700, #aa7aa0); }
