    .dg-chart-engines-ops .s1 { fill: var(--semantic-color-background-fill-data-viz-200, #e98a2e); }
    .dg-chart-engines-ops .s2 { fill: var(--semantic-color-background-fill-data-viz-300, #d5525a); }
    .dg-chart-engines-ops .s3 { fill: var(--semantic-color-background-fill-data-viz-400, #80b9b2); }
    .dg-chart-engines-ops .s4 { fill: var(--semantic-color-background-fill-data-viz-500, #66a14f); }
    .dg-chart-engines-ops .s5 { fill: var(--semantic-color-background-fill-data-viz-600, #e9c74c); }
    .dg-chart-engines-ops .s6 { fill: var(--semantic-color-background-fill-data-viz-700, #aa7aa0); }
    .dg-chart-engines-ops .s7 { fill: var(--semantic-color-background-fill-data-viz-800, #f79ba8); }
