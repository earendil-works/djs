<svg xmlns="http://www.w3.org/2000/svg" class="dg-chart-engines-ops" viewBox="0 0 720 558" width="720" height="558" role="img" aria-labelledby="chart-engines-ops-t chart-engines-ops-d">
<title id="chart-engines-ops-t">djs's time over the best QuickJS build's, per operation, on a logarithmic scale around parity</title>
<desc id="chart-engines-ops-d">Bars from the parity line at 1: to the left djs is faster, to the right slower. The table below has the times.</desc>
<style>
