<svg xmlns="http://www.w3.org/2000/svg" class="dg-cell-Symbol" viewBox="0 0 580 214" width="580" height="214" role="img" aria-label="Layout of the Symbol cell">
<title>Layout of the Symbol cell</title>
<style>
  .dg-cell-Symbol text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-cell-Symbol .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-cell-Symbol .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-cell-Symbol .label { font-weight: 600; }
  .dg-cell-Symbol .title { font-weight: 600; font-size: 13px; }
  .dg-cell-Symbol .box, .dg-cell-Symbol .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-cell-Symbol .hdr, .dg-cell-Symbol .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-cell-Symbol .traced, .dg-cell-Symbol .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-cell-Symbol .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-cell-Symbol .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-cell-Symbol .pad { fill: url(#cell-Symbol-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-cell-Symbol .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-cell-Symbol .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-cell-Symbol .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-cell-Symbol .opt { stroke-dasharray: 3 2; }
  .dg-cell-Symbol .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-cell-Symbol .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-cell-Symbol .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#cell-Symbol-a); }
  .dg-cell-Symbol .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#cell-Symbol-a); }
  .dg-cell-Symbol .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-cell-Symbol .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  @media (prefers-color-scheme: dark) {
    .dg-cell-Symbol text { fill: var(--semantic-color-text-primary, #f6f6f6); }
    .dg-cell-Symbol .small { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Symbol .box, .dg-cell-Symbol .host { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cell-Symbol .hdr, .dg-cell-Symbol .engine { fill: var(--semantic-color-background-fill-secondary-information, #1e313b); stroke: var(--semantic-color-border-information, #4c9bc1); }
    .dg-cell-Symbol .traced, .dg-cell-Symbol .arena { fill: var(--semantic-color-background-fill-secondary-warning, #3b2b0c); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-cell-Symbol .tag { fill: var(--semantic-color-background-fill-secondary-positive, #1f3328); stroke: var(--semantic-color-border-positive, #4da578); }
    .dg-cell-Symbol .cell { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-cell-Symbol .pad { stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-cell-Symbol .tail { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cell-Symbol .zero { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cell-Symbol .dead { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-cell-Symbol .rule { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Symbol .dash { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Symbol .arrow { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Symbol .faint { stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cell-Symbol .head { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-cell-Symbol .hatch { stroke: var(--semantic-color-border-secondary, #464646); }
  }
</style>
<defs><pattern id="cell-Symbol-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern><marker id="cell-Symbol-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<text class="small mono" x="88" y="22" text-anchor="middle">+0</text>
<text class="small mono" x="152" y="22" text-anchor="middle">+1</text>
<text class="small mono" x="216" y="22" text-anchor="middle">+2</text>
<text class="small mono" x="280" y="22" text-anchor="middle">+3</text>
<text class="small mono" x="344" y="22" text-anchor="middle">+4</text>
<text class="small mono" x="408" y="22" text-anchor="middle">+5</text>
<text class="small mono" x="472" y="22" text-anchor="middle">+6</text>
<text class="small mono" x="536" y="22" text-anchor="middle">+7</text>
<text class="small mono" x="48" y="55" text-anchor="end">0</text>
<text class="small mono" x="48" y="99" text-anchor="end">8</text>
<text class="small mono" x="48" y="143" text-anchor="end">16</text>
<rect class="hdr" x="57" y="31" width="62" height="40" rx="3"/>
<text class="mono" x="88" y="48" text-anchor="middle">KIND</text>
<text class="small" x="88" y="62" text-anchor="middle">u8</text>
<rect class="hdr" x="121" y="31" width="62" height="40" rx="3"/>
<text class="mono" x="152" y="48" text-anchor="middle">GC</text>
<text class="small" x="152" y="62" text-anchor="middle">u8</text>
<rect class="hdr" x="185" y="31" width="126" height="40" rx="3"/>
<text class="mono" x="248" y="48" text-anchor="middle">FLAGS</text>
<text class="small" x="248" y="62" text-anchor="middle">u16</text>
<rect class="hdr" x="313" y="31" width="254" height="40" rx="3"/>
<text class="mono" x="440" y="48" text-anchor="middle">SIZE</text>
<text class="small" x="440" y="62" text-anchor="middle">u32</text>
<rect class="box" x="57" y="75" width="254" height="40" rx="3"/>
<text class="mono" x="184" y="92" text-anchor="middle">ATOM</text>
<text class="small" x="184" y="106" text-anchor="middle">u32</text>
<rect class="traced" x="57" y="119" width="510" height="40" rx="3"/>
<text class="mono" x="312" y="136" text-anchor="middle">DESCRIPTION</text>
<text class="small" x="312" y="150" text-anchor="middle">Value</text>
<rect class="pad" x="313" y="75" width="62" height="40" rx="3"/>
<rect class="pad" x="377" y="75" width="62" height="40" rx="3"/>
<rect class="pad" x="441" y="75" width="62" height="40" rx="3"/>
<rect class="pad" x="505" y="75" width="62" height="40" rx="3"/>
<rect class="hdr" x="56" y="188" width="14" height="12" rx="3"/>
<text class="small" x="76" y="198" text-anchor="start">header</text>
<rect class="traced" x="129.6" y="188" width="14" height="12" rx="3"/>
<text class="small" x="149.6" y="198" text-anchor="start">traced by the GC (Value, Ref)</text>
<rect class="box" x="332" y="188" width="14" height="12" rx="3"/>
<text class="small" x="352" y="198" text-anchor="start">plain data</text>
<rect class="pad" x="428" y="188" width="14" height="12" rx="3"/>
<text class="small" x="448" y="198" text-anchor="start">padding</text>
</svg>
