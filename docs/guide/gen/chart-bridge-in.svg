<svg xmlns="http://www.w3.org/2000/svg" class="dg-chart-bridge-in" viewBox="0 0 720 288" width="720" height="288" role="img" aria-labelledby="chart-bridge-in-t chart-bridge-in-d">
<title id="chart-bridge-in-t">Putting a value into the VM, per payload and engine, in ms on a logarithmic scale</title>
<desc id="chart-bridge-in-d">Grouped columns: one group per payload, one column per engine, lower is better. The table below has the exact numbers.</desc>
<style>
  .dg-chart-bridge-in text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-chart-bridge-in .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-chart-bridge-in .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-bridge-in .label { font-weight: 600; }
  .dg-chart-bridge-in .title { font-weight: 600; font-size: 13px; }
  .dg-chart-bridge-in .box, .dg-chart-bridge-in .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-chart-bridge-in .hdr, .dg-chart-bridge-in .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-chart-bridge-in .traced, .dg-chart-bridge-in .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-bridge-in .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-chart-bridge-in .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-bridge-in .pad { fill: url(#chart-bridge-in-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-bridge-in .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-bridge-in .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-bridge-in .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-chart-bridge-in .opt { stroke-dasharray: 3 2; }
  .dg-chart-bridge-in .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-chart-bridge-in .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-bridge-in .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#chart-bridge-in-a); }
  .dg-chart-bridge-in .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#chart-bridge-in-a); }
  .dg-chart-bridge-in .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-bridge-in .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-bridge-in .grid { stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-width: 1; }
  .dg-chart-bridge-in .axis { stroke: var(--semantic-color-border-primary, #777777); stroke-width: 1; }
  .dg-chart-bridge-in .parity { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-bridge-in .faster { fill: var(--semantic-color-background-fill-primary-positive, #2e6c4c); }
  .dg-chart-bridge-in .slower { fill: var(--semantic-color-background-fill-primary-negative, #a42c2d); }
  .dg-chart-bridge-in .s0 { fill: var(--semantic-color-background-fill-data-viz-100, #557ca7); }
  .dg-chart-bridge-in .s1 { fill: var(--semantic-color-background-fill-data-viz-200, #e98a2e); }
  .dg-chart-bridge-in .s2 { fill: var(--semantic-color-background-fill-data-viz-300, #d5525a); }
  .dg-chart-bridge-in .s3 { fill: var(--semantic-color-background-fill-data-viz-400, #80b9b2); }
  .dg-chart-bridge-in .s4 { fill: var(--semantic-color-background-fill-data-viz-500, #66a14f); }
  .dg-chart-bridge-in .s5 { fill: var(--semantic-color-background-fill-data-viz-600, #e9c74c); }
  .dg-chart-bridge-in .s6 { fill: var(--semantic-color-background-fill-data-viz-700, #aa7aa0); }
  .dg-chart-bridge-in .s7 { fill: var(--semantic-color-background-fill-data-viz-800, #f79ba8); }
  .dg-chart-bridge-in .s8 { fill: var(--semantic-color-background-fill-data-viz-900, #98745e); }
  .dg-chart-bridge-in .s9 { fill: var(--semantic-color-background-fill-data-viz-1000, #b9b0ab); }
