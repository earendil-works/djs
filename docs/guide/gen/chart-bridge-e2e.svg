  .dg-chart-bridge-e2e .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-bridge-e2e .label { font-weight: 600; }
  .dg-chart-bridge-e2e .title { font-weight: 600; font-size: 13px; }
