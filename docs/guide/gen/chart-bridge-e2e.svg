<svg xmlns="http://www.w3.org/2000/svg" class="dg-chart-bridge-e2e" viewBox="0 0 720 168" width="720" height="168" role="img" aria-labelledby="chart-bridge-e2e-t chart-bridge-e2e-d">
<title id="chart-bridge-e2e-t">Whole runs that pass data through a tool, per engine, in ms on logarithmic scales</title>
<desc id="chart-bridge-e2e-d">Horizontal bars per engine, one panel per case: a tool's 1 MB result of which the script reads one field, a 1 MB file read, edited and written back, and a thousand small calls. Lower is better. The table below has the exact numbers.</desc>
<style>
  .dg-chart-bridge-e2e text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
