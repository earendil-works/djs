<svg xmlns="http://www.w3.org/2000/svg" class="dg-chart-engines-startup" viewBox="0 0 720 168" width="720" height="168" role="img" aria-labelledby="chart-engines-startup-t chart-engines-startup-d">
<title id="chart-engines-startup-t">Compiling the module, starting a VM and an idle VM's memory, per engine</title>
<desc id="chart-engines-startup-d">Horizontal bars per engine: compile time in ms and idle memory in MiB on logarithmic scales, new-VM time in ms on a linear one. The table below has the exact numbers.</desc>
<style>
  .dg-chart-engines-startup text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-chart-engines-startup .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-chart-engines-startup .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-engines-startup .label { font-weight: 600; }
  .dg-chart-engines-startup .title { font-weight: 600; font-size: 13px; }
  .dg-chart-engines-startup .box, .dg-chart-engines-startup .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-chart-engines-startup .hdr, .dg-chart-engines-startup .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-chart-engines-startup .traced, .dg-chart-engines-startup .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-engines-startup .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-chart-engines-startup .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-engines-startup .pad { fill: url(#chart-engines-startup-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-engines-startup .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-engines-startup .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
