    .dg-chart-engines-size .s4 { fill: var(--semantic-color-background-fill-data-viz-500, #66a14f); }
    .dg-chart-engines-size .s5 { fill: var(--semantic-color-background-fill-data-viz-600, #e9c74c); }
    .dg-chart-engines-size .s6 { fill: var(--semantic-color-background-fill-data-viz-700, #aa7aa0); }
    .dg-chart-engines-size .s7 { fill: var(--semantic-color-background-fill-data-viz-800, #f79ba8); }
    .dg-chart-engines-size .s8 { fill: var(--semantic-color-background-fill-data-viz-900, #98745e); }
