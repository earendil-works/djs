  .dg-chart-engines-size .grid { stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-width: 1; }
  .dg-chart-engines-size .axis { stroke: var(--semantic-color-border-primary, #777777); stroke-width: 1; }
  .dg-chart-engines-size .parity { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-engines-size .faster { fill: var(--semantic-color-background-fill-primary-positive, #2e6c4c); }
  .dg-chart-engines-size .slower { fill: var(--semantic-color-background-fill-primary-negative, #a42c2d); }
  .dg-chart-engines-size .s0 { fill: var(--semantic-color-background-fill-data-viz-100, #557ca7); }
  .dg-chart-engines-size .s1 { fill: var(--semantic-color-background-fill-data-viz-200, #e98a2e); }
