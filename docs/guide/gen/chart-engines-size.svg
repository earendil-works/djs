    .dg-chart-engines-size .parity { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-chart-engines-size .faster { fill: var(--semantic-color-background-fill-primary-positive, #4da578); }
    .dg-chart-engines-size .slower { fill: var(--semantic-color-background-fill-primary-negative, #ea5a56); }
    .dg-chart-engines-size .s0 { fill: var(--semantic-color-background-fill-data-viz-100, #557ca7); }
    .dg-chart-engines-size .s1 { fill: var(--semantic-color-background-fill-data-viz-200, #e98a2e); }
    .dg-chart-engines-size .s2 { fill: var(--semantic-color-background-fill-data-viz-300, #d5525a); }
