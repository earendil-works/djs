<svg xmlns="http://www.w3.org/2000/svg" class="dg-chart-engines-size" viewBox="0 0 720 168" width="720" height="168" role="img" aria-labelledby="chart-engines-size-t chart-engines-size-d">
<title id="chart-engines-size-t">Module size per engine, raw and with gzip, in KB on a logarithmic scale</title>
<desc id="chart-engines-size-d">Horizontal bars per engine: the wasm module's bytes and its gzip -9 size. The table below has the exact numbers.</desc>
<style>
  .dg-chart-engines-size text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-chart-engines-size .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-chart-engines-size .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-engines-size .label { font-weight: 600; }
  .dg-chart-engines-size .title { font-weight: 600; font-size: 13px; }
  .dg-chart-engines-size .box, .dg-chart-engines-size .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-chart-engines-size .hdr, .dg-chart-engines-size .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-chart-engines-size .traced, .dg-chart-engines-size .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-engines-size .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-chart-engines-size .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-engines-size .pad { fill: url(#chart-engines-size-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-engines-size .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-engines-size .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
