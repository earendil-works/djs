  .dg-chart-engines-size .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-engines-size .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#chart-engines-size-a); }
  .dg-chart-engines-size .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#chart-engines-size-a); }
  .dg-chart-engines-size .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
