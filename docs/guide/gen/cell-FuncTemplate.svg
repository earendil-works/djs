<text class="small" x="536" y="282" text-anchor="middle">u8</text>
<rect class="tail" x="57" y="295" width="510" height="40" rx="3"/>
<text class="mono" x="312" y="312" text-anchor="middle">DATA: u8 × n</text>
<text class="small" x="312" y="326" text-anchor="middle">variable-length tail; n follows from SIZE</text>
<rect class="hdr" x="56" y="364" width="14" height="12" rx="3"/>
