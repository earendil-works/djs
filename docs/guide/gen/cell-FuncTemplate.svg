<text class="small" x="184" y="106" text-anchor="middle">u32</text>
<rect class="box" x="313" y="75" width="254" height="40" rx="3"/>
<text class="mono" x="440" y="92" text-anchor="middle">NAME</text>
<text class="small" x="440" y="106" text-anchor="middle">u32</text>
<rect class="box" x="57" y="119" width="126" height="40" rx="3"/>
<text class="mono" x="120" y="136" text-anchor="middle">PARAMS</text>
<text class="small" x="120" y="150" text-anchor="middle">u16</text>
