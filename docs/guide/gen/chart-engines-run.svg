<svg xmlns="http://www.w3.org/2000/svg" class="dg-chart-engines-run" viewBox="0 0 720 274" width="720" height="274" role="img" aria-labelledby="chart-engines-run-t chart-engines-run-d">
<title id="chart-engines-run-t">Run time per workload and engine, in ms on a logarithmic scale</title>
<desc id="chart-engines-run-d">Grouped columns: one group per workload, one column per engine, lower is better. The table below has the exact numbers.</desc>
<style>
  .dg-chart-engines-run text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-chart-engines-run .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-chart-engines-run .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-engines-run .label { font-weight: 600; }
  .dg-chart-engines-run .title { font-weight: 600; font-size: 13px; }
  .dg-chart-engines-run .box, .dg-chart-engines-run .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-chart-engines-run .hdr, .dg-chart-engines-run .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-chart-engines-run .traced, .dg-chart-engines-run .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-engines-run .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-chart-engines-run .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-engines-run .pad { fill: url(#chart-engines-run-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-engines-run .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-engines-run .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-engines-run .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
