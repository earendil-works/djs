  .dg-chart-engines-run .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-engines-run .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#chart-engines-run-a); }
  .dg-chart-engines-run .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#chart-engines-run-a); }
  .dg-chart-engines-run .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-engines-run .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-engines-run .grid { stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-width: 1; }
  .dg-chart-engines-run .axis { stroke: var(--semantic-color-border-primary, #777777); stroke-width: 1; }
  .dg-chart-engines-run .parity { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-engines-run .faster { fill: var(--semantic-color-background-fill-primary-positive, #2e6c4c); }
  .dg-chart-engines-run .slower { fill: var(--semantic-color-background-fill-primary-negative, #a42c2d); }
  .dg-chart-engines-run .s0 { fill: var(--semantic-color-background-fill-data-viz-100, #557ca7); }
