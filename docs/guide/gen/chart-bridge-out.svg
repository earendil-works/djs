    .dg-chart-bridge-out .dead { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-chart-bridge-out .rule { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-chart-bridge-out .dash { stroke: var(--semantic-color-text-secondary, #ababab); }
