    .dg-chart-bridge-out text { fill: var(--semantic-color-text-primary, #f6f6f6); }
    .dg-chart-bridge-out .small { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-chart-bridge-out .box, .dg-chart-bridge-out .host { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-chart-bridge-out .hdr, .dg-chart-bridge-out .engine { fill: var(--semantic-color-background-fill-secondary-information, #1e313b); stroke: var(--semantic-color-border-information, #4c9bc1); }
    .dg-chart-bridge-out .traced, .dg-chart-bridge-out .arena { fill: var(--semantic-color-background-fill-secondary-warning, #3b2b0c); stroke: var(--semantic-color-border-warning, #b8880c); }
