<svg xmlns="http://www.w3.org/2000/svg" class="dg-chart-bridge-out" viewBox="0 0 720 288" width="720" height="288" role="img" aria-labelledby="chart-bridge-out-t chart-bridge-out-d">
<title id="chart-bridge-out-t">Reading a value out of the VM, per payload and engine, in ms on a logarithmic scale</title>
<desc id="chart-bridge-out-d">Grouped columns: one group per payload, one column per engine, lower is better. The table below has the exact numbers.</desc>
<style>
  .dg-chart-bridge-out text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-chart-bridge-out .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-chart-bridge-out .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-bridge-out .label { font-weight: 600; }
  .dg-chart-bridge-out .title { font-weight: 600; font-size: 13px; }
  .dg-chart-bridge-out .box, .dg-chart-bridge-out .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-chart-bridge-out .hdr, .dg-chart-bridge-out .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-chart-bridge-out .traced, .dg-chart-bridge-out .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-bridge-out .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-chart-bridge-out .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-chart-bridge-out .pad { fill: url(#chart-bridge-out-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-bridge-out .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-bridge-out .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-chart-bridge-out .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-chart-bridge-out .opt { stroke-dasharray: 3 2; }
  .dg-chart-bridge-out .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-chart-bridge-out .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-bridge-out .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#chart-bridge-out-a); }
  .dg-chart-bridge-out .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#chart-bridge-out-a); }
  .dg-chart-bridge-out .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-chart-bridge-out .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-chart-bridge-out .grid { stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-width: 1; }
  .dg-chart-bridge-out .axis { stroke: var(--semantic-color-border-primary, #777777); stroke-width: 1; }
  .dg-chart-bridge-out .parity { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-chart-bridge-out .faster { fill: var(--semantic-color-background-fill-primary-positive, #2e6c4c); }
  .dg-chart-bridge-out .slower { fill: var(--semantic-color-background-fill-primary-negative, #a42c2d); }
  .dg-chart-bridge-out .s0 { fill: var(--semantic-color-background-fill-data-viz-100, #557ca7); }
  .dg-chart-bridge-out .s1 { fill: var(--semantic-color-background-fill-data-viz-200, #e98a2e); }
  .dg-chart-bridge-out .s2 { fill: var(--semantic-color-background-fill-data-viz-300, #d5525a); }
  .dg-chart-bridge-out .s3 { fill: var(--semantic-color-background-fill-data-viz-400, #80b9b2); }
  .dg-chart-bridge-out .s4 { fill: var(--semantic-color-background-fill-data-viz-500, #66a14f); }
  .dg-chart-bridge-out .s5 { fill: var(--semantic-color-background-fill-data-viz-600, #e9c74c); }
  .dg-chart-bridge-out .s6 { fill: var(--semantic-color-background-fill-data-viz-700, #aa7aa0); }
  .dg-chart-bridge-out .s7 { fill: var(--semantic-color-background-fill-data-viz-800, #f79ba8); }
  .dg-chart-bridge-out .s8 { fill: var(--semantic-color-background-fill-data-viz-900, #98745e); }
  .dg-chart-bridge-out .s9 { fill: var(--semantic-color-background-fill-data-viz-1000, #b9b0ab); }
