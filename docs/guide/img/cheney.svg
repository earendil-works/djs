<svg class="dg-cheney" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="A Cheney collection: live cells are copied from the old arena into a new one, which is scanned from offset 0 until the scan catches up with the copy point">
<title>A Cheney collection: live cells are copied from the old arena into a new one, which is scanned from offset 0 until the scan catches up with the copy point</title>
<style>
  .dg-cheney text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-cheney .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-cheney .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-cheney .label { font-weight: 600; }
  .dg-cheney .title { font-weight: 600; font-size: 13px; }
  .dg-cheney .box, .dg-cheney .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-cheney .hdr, .dg-cheney .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-cheney .traced, .dg-cheney .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-cheney .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-cheney .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-cheney .pad { fill: url(#cheney-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-cheney .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-cheney .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-cheney .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-cheney .opt { stroke-dasharray: 3 2; }
  .dg-cheney .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-cheney .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-cheney .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#cheney-a); }
  .dg-cheney .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#cheney-a); }
  .dg-cheney .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-cheney .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  @media (prefers-color-scheme: dark) {
    .dg-cheney text { fill: var(--semantic-color-text-primary, #f6f6f6); }
    .dg-cheney .small { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-cheney .box, .dg-cheney .host { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cheney .hdr, .dg-cheney .engine { fill: var(--semantic-color-background-fill-secondary-information, #1e313b); stroke: var(--semantic-color-border-information, #4c9bc1); }
    .dg-cheney .traced, .dg-cheney .arena { fill: var(--semantic-color-background-fill-secondary-warning, #3b2b0c); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-cheney .tag { fill: var(--semantic-color-background-fill-secondary-positive, #1f3328); stroke: var(--semantic-color-border-positive, #4da578); }
    .dg-cheney .cell { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-cheney .pad { stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-cheney .tail { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cheney .zero { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cheney .dead { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-cheney .rule { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-cheney .dash { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-cheney .arrow { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-cheney .faint { stroke: var(--semantic-color-border-primary, #919191); }
    .dg-cheney .head { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-cheney .hatch { stroke: var(--semantic-color-border-secondary, #464646); }
  }
</style>
<defs><pattern id="cheney-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern><marker id="cheney-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>

<text class="title" x="20" y="24">old arena (from-space)</text>
<rect class="arena" x="20" y="34" width="60" height="40"/><text x="50" y="58" text-anchor="middle">Roots</text>
<rect class="cell" x="80" y="34" width="70" height="40"/><text x="115" y="58" text-anchor="middle">A</text>
<rect class="dead" x="150" y="34" width="90" height="40"/><text class="small" x="195" y="58" text-anchor="middle">garbage</text>
<rect class="cell" x="240" y="34" width="60" height="40"/><text x="270" y="58" text-anchor="middle">C</text>
<rect class="dead" x="300" y="34" width="70" height="40"/><text class="small" x="335" y="58" text-anchor="middle">garbage</text>
<rect class="cell" x="370" y="34" width="80" height="40"/><text x="410" y="58" text-anchor="middle">B</text>
<rect class="dead" x="450" y="34" width="60" height="40"/>
<text class="small" x="530" y="50">Roots → A, B;  A → C</text>
<text class="small" x="530" y="66">copied cells: FORWARDED + new offset</text>

<text class="title" x="20" y="196">new arena (to-space)</text>
<rect class="arena" x="20" y="134" width="60" height="40"/><text x="50" y="158" text-anchor="middle">Roots</text>
<rect class="cell" x="80" y="134" width="70" height="40"/><text x="115" y="158" text-anchor="middle">A</text>
<rect class="cell" x="150" y="134" width="80" height="40"/><text x="190" y="158" text-anchor="middle">B</text>
<rect class="cell" x="230" y="134" width="60" height="40"/><text x="260" y="158" text-anchor="middle">C</text>

<path class="arrow" d="M115 74 C 115 100, 115 105, 115 132"/>
<path class="arrow" d="M410 74 C 400 110, 220 100, 192 132"/>
<path class="arrow" d="M270 74 C 270 100, 262 105, 260 132"/>

<line class="rule" x1="150" y1="128" x2="150" y2="196"/>
<text class="mono" x="150" y="210" text-anchor="middle">scan</text>
<line class="rule" x1="290" y1="128" x2="290" y2="196"/>
<text class="mono" x="290" y="210" text-anchor="middle">copy point</text>

<rect class="host" x="360" y="128" width="380" height="104" rx="5"/>
<text class="small" x="374" y="148">1. reserve the to-space (the from-space's size), copy Roots to 0</text>
<text class="small" x="374" y="166">2. scan cell by cell; for each traced field, copy its target to</text>
<text class="small" x="374" y="182">    the copy point (once) and write the new offset into the field</text>
<text class="small" x="374" y="200">3. stop when scan meets the copy point; drop the old arena</text>
<text class="small" x="374" y="222">The order is breadth-first from the roots, in field order.</text>
</svg>
