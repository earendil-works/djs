<svg class="dg-arena" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The arena: cells back to back from offset 0, the zeroed frontier, the GC threshold and the memory cap">
<title>The arena: cells back to back from offset 0, the zeroed frontier, the GC threshold and the memory cap</title>
<style>
  .dg-arena text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-arena .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-arena .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-arena .label { font-weight: 600; }
  .dg-arena .title { font-weight: 600; font-size: 13px; }
  .dg-arena .box, .dg-arena .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-arena .hdr, .dg-arena .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-arena .traced, .dg-arena .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-arena .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-arena .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-arena .pad { fill: url(#arena-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-arena .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-arena .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-arena .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-arena .opt { stroke-dasharray: 3 2; }
  .dg-arena .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-arena .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-arena .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#arena-a); }
  .dg-arena .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#arena-a); }
  .dg-arena .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-arena .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  @media (prefers-color-scheme: dark) {
    .dg-arena text { fill: var(--semantic-color-text-primary, #f6f6f6); }
    .dg-arena .small { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-arena .box, .dg-arena .host { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-arena .hdr, .dg-arena .engine { fill: var(--semantic-color-background-fill-secondary-information, #1e313b); stroke: var(--semantic-color-border-information, #4c9bc1); }
    .dg-arena .traced, .dg-arena .arena { fill: var(--semantic-color-background-fill-secondary-warning, #3b2b0c); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-arena .tag { fill: var(--semantic-color-background-fill-secondary-positive, #1f3328); stroke: var(--semantic-color-border-positive, #4da578); }
    .dg-arena .cell { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-arena .pad { stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-arena .tail { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-arena .zero { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-arena .dead { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-arena .rule { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-arena .dash { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-arena .arrow { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-arena .faint { stroke: var(--semantic-color-border-primary, #919191); }
    .dg-arena .head { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-arena .hatch { stroke: var(--semantic-color-border-secondary, #464646); }
  }
</style>
<defs><pattern id="arena-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern><marker id="arena-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>

<!-- A value pointing into the arena -->
<rect class="engine" x="20" y="14" width="250" height="40" rx="5"/>
<text class="mono" x="34" y="31">0xFFF8_0009 │ 0x0001_2A40</text>
<text class="small" x="34" y="46">a Value: tag OBJECT, payload = byte offset</text>
<path class="arrow" d="M200 54 C 220 90, 300 80, 318 108"/>

<!-- The bar -->
<text class="mono small" x="20" y="100">0</text>
<rect class="arena" x="20" y="108" width="74" height="54" rx="3"/>
<text class="title" x="57" y="132" text-anchor="middle">Roots</text>
<text class="small" x="57" y="149" text-anchor="middle">offset 0</text>
<rect class="cell" x="94" y="108" width="150" height="54"/>
<text x="169" y="132" text-anchor="middle">atoms, realm, builtins</text>
<text class="small" x="169" y="149" text-anchor="middle">from the base snapshot</text>
<rect class="cell" x="244" y="108" width="40" height="54"/>
<rect class="cell" x="284" y="108" width="70" height="54"/>
<text x="319" y="139" text-anchor="middle">Object</text>
<rect class="cell" x="354" y="108" width="28" height="54"/>
<rect class="cell" x="382" y="108" width="58" height="54"/>
<text x="411" y="139" text-anchor="middle">Str8</text>
<rect class="cell" x="440" y="108" width="34" height="54"/>
<rect class="zero" x="474" y="108" width="74" height="54"/>
<text class="small" x="511" y="132" text-anchor="middle">zeroed</text>
<text class="small" x="511" y="146" text-anchor="middle">≤ 16 KiB</text>

<!-- Markers -->
<line class="rule" x1="474" y1="100" x2="474" y2="176"/>
<text class="mono" x="474" y="94" text-anchor="middle">len</text>
<text class="small" x="474" y="190" text-anchor="middle">next allocation</text>
<line class="dash" x1="548" y1="108" x2="610" y2="108"/>
<line class="dash" x1="548" y1="162" x2="610" y2="162"/>
<line class="rule" x1="610" y1="100" x2="610" y2="176"/>
<text class="mono" x="610" y="94" text-anchor="middle">threshold</text>
<text class="small" x="610" y="190" text-anchor="middle">gc_pending; growth slows</text>
<line class="dash" x1="610" y1="108" x2="680" y2="108"/>
<line class="dash" x1="610" y1="162" x2="680" y2="162"/>
<line class="rule" x1="680" y1="100" x2="680" y2="176"/>
<text class="mono" x="680" y="94" text-anchor="middle">limit</text>
<rect class="host" x="680" y="108" width="56" height="54"/>
<text class="small" x="708" y="132" text-anchor="middle">OOM</text>
<text class="small" x="708" y="146" text-anchor="middle">reserve</text>
<line class="rule" x1="736" y1="100" x2="736" y2="176"/>
<text class="mono" x="736" y="94" text-anchor="end">cap</text>

<!-- Header detail -->
<path class="arrow" d="M300 162 C 300 200, 240 205, 210 222"/>
<rect class="host" x="20" y="222" width="420" height="64" rx="5"/>
<text class="title" x="34" y="242">every cell starts with an 8-byte header</text>
<text class="mono" x="34" y="262">kind:u8  gc:u8  flags:u16  size:u32  │ fields …</text>
<text class="small" x="34" y="278">size is the whole cell, so offset + size is the next cell: the arena is walkable</text>
<rect class="host" x="460" y="222" width="276" height="64" rx="5"/>
<text class="title" x="474" y="242">bump allocation</text>
<text class="small" x="474" y="262">round up to 8, check against the limit, move len</text>
<text class="small" x="474" y="278">never collects: past the threshold it only sets a flag</text>
</svg>
