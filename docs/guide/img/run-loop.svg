<svg class="dg-run-loop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="How a host drives a run: vm_run returns a status, the host acts on it and runs again">
<title>How a host drives a run: vm_run returns a status, the host acts on it and runs again</title>
<style>
  .dg-run-loop text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-run-loop .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-run-loop .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-run-loop .label { font-weight: 600; }
  .dg-run-loop .title { font-weight: 600; font-size: 13px; }
  .dg-run-loop .box, .dg-run-loop .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-run-loop .hdr, .dg-run-loop .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-run-loop .traced, .dg-run-loop .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-run-loop .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-run-loop .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-run-loop .pad { fill: url(#run-loop-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-run-loop .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-run-loop .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-run-loop .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-run-loop .opt { stroke-dasharray: 3 2; }
  .dg-run-loop .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-run-loop .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-run-loop .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#run-loop-a); }
  .dg-run-loop .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#run-loop-a); }
  .dg-run-loop .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-run-loop .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  @media (prefers-color-scheme: dark) {
    .dg-run-loop text { fill: var(--semantic-color-text-primary, #f6f6f6); }
    .dg-run-loop .small { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-run-loop .box, .dg-run-loop .host { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-run-loop .hdr, .dg-run-loop .engine { fill: var(--semantic-color-background-fill-secondary-information, #1e313b); stroke: var(--semantic-color-border-information, #4c9bc1); }
    .dg-run-loop .traced, .dg-run-loop .arena { fill: var(--semantic-color-background-fill-secondary-warning, #3b2b0c); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-run-loop .tag { fill: var(--semantic-color-background-fill-secondary-positive, #1f3328); stroke: var(--semantic-color-border-positive, #4da578); }
    .dg-run-loop .cell { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-run-loop .pad { stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-run-loop .tail { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-run-loop .zero { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-run-loop .dead { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-run-loop .rule { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-run-loop .dash { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-run-loop .arrow { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-run-loop .faint { stroke: var(--semantic-color-border-primary, #919191); }
    .dg-run-loop .head { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-run-loop .hatch { stroke: var(--semantic-color-border-secondary, #464646); }
  }
</style>
<defs><pattern id="run-loop-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern><marker id="run-loop-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>

<!-- Start -->
<rect class="host" x="10" y="120" width="140" height="60" rx="6"/>
<text x="80" y="140" text-anchor="middle">compile, call</text>
<text class="mono" x="80" y="157" text-anchor="middle">vm_compile</text>
<text class="mono" x="80" y="171" text-anchor="middle">vm_call</text>
<path class="arrow" d="M150 150 L218 150"/>

<!-- vm_run -->
<rect class="engine" x="220" y="110" width="150" height="80" rx="8"/>
<text class="title" x="295" y="138" text-anchor="middle">vm_run(slice)</text>
<text class="small" x="295" y="156" text-anchor="middle">runs until fuel, a host</text>
<text class="small" x="295" y="170" text-anchor="middle">call or the end</text>

<!-- Outcomes -->
<rect class="host" x="440" y="10" width="310" height="54" rx="6"/>
<text x="452" y="30"><tspan class="mono">OUT_OF_FUEL</tspan>: the host gets control back</text>
<text class="small" x="452" y="48">poll for cancellation, snapshot if waiting is long, run again</text>

<rect class="host" x="440" y="76" width="310" height="66" rx="6"/>
<text x="452" y="96"><tspan class="mono">HOST_CALL</tspan>: a sync host function, VM parked</text>
<text class="small" x="452" y="114">read the arguments with the reader, call it,</text>
<text class="small" x="452" y="128">send the result in (wire), resolve the call</text>

<rect class="host" x="440" y="154" width="310" height="66" rx="6"/>
<text x="452" y="174"><tspan class="mono">IDLE</tspan>: only async host calls are pending</text>
<text class="small" x="452" y="192">await one, resolve it: the result goes into the</text>
<text class="small" x="452" y="206">VM's inbox, applied when its job queue is empty</text>

<rect class="host" x="440" y="232" width="310" height="58" rx="6"/>
<text x="452" y="252"><tspan class="mono">DONE</tspan> / <tspan class="mono">THREW</tspan>: the run is over</text>
<text class="small" x="452" y="270">read the result or the error with the reader</text>

<path class="arrow" d="M370 125 L438 40"/>
<path class="arrow" d="M370 140 L438 108"/>
<path class="arrow" d="M370 160 L438 186"/>
<path class="arrow" d="M370 175 L438 258"/>

<!-- Back edges -->
<path class="arrow" d="M440 52 C400 70 380 95 360 110"/>
<path class="arrow" d="M440 130 C415 140 395 140 372 146"/>
<path class="arrow" d="M440 210 C405 210 390 200 360 190"/>
</svg>
