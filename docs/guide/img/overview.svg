<svg class="dg-overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="The parts of djs and the arena they share">
<title>The parts of djs and the arena they share</title>
<style>
  .dg-overview text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-overview .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-overview .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-overview .label { font-weight: 600; }
  .dg-overview .title { font-weight: 600; font-size: 13px; }
  .dg-overview .box, .dg-overview .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-overview .hdr, .dg-overview .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-overview .traced, .dg-overview .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-overview .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-overview .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-overview .pad { fill: url(#overview-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-overview .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-overview .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-overview .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-overview .opt { stroke-dasharray: 3 2; }
  .dg-overview .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-overview .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-overview .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#overview-a); }
  .dg-overview .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#overview-a); }
  .dg-overview .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-overview .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  @media (prefers-color-scheme: dark) {
    .dg-overview text { fill: var(--semantic-color-text-primary, #f6f6f6); }
    .dg-overview .small { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-overview .box, .dg-overview .host { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-overview .hdr, .dg-overview .engine { fill: var(--semantic-color-background-fill-secondary-information, #1e313b); stroke: var(--semantic-color-border-information, #4c9bc1); }
    .dg-overview .traced, .dg-overview .arena { fill: var(--semantic-color-background-fill-secondary-warning, #3b2b0c); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-overview .tag { fill: var(--semantic-color-background-fill-secondary-positive, #1f3328); stroke: var(--semantic-color-border-positive, #4da578); }
    .dg-overview .cell { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-overview .pad { stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-overview .tail { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-overview .zero { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-overview .dead { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-overview .rule { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-overview .dash { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-overview .arrow { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-overview .faint { stroke: var(--semantic-color-border-primary, #919191); }
    .dg-overview .head { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-overview .hatch { stroke: var(--semantic-color-border-secondary, #464646); }
  }
</style>
<defs><pattern id="overview-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern><marker id="overview-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>

<!-- The host -->
<rect class="host" x="10" y="10" width="170" height="310" rx="8"/>
<text class="title" x="95" y="32" text-anchor="middle">Host (JavaScript)</text>
<text class="small" x="95" y="48" text-anchor="middle">pi's codemode, a Sandbox</text>
<rect class="host" x="22" y="64" width="146" height="40" rx="5"/>
<text x="95" y="81" text-anchor="middle">script source</text>
<text class="small" x="95" y="96" text-anchor="middle">JS or TypeScript</text>
<rect class="host" x="22" y="124" width="146" height="40" rx="5"/>
<text x="95" y="141" text-anchor="middle">tool functions</text>
<text class="small" x="95" y="156" text-anchor="middle">answered later</text>
<rect class="host" x="22" y="184" width="146" height="40" rx="5"/>
<text x="95" y="201" text-anchor="middle">wire encoder</text>
<text class="small" x="95" y="216" text-anchor="middle">values in</text>
<rect class="host" x="22" y="244" width="146" height="40" rx="5"/>
<text x="95" y="261" text-anchor="middle">heap reader</text>
<text class="small" x="95" y="276" text-anchor="middle">values out, read in place</text>

<!-- The engine -->
<rect class="engine" x="220" y="10" width="530" height="96" rx="8"/>
<text class="title" x="485" y="30" text-anchor="middle">djs-core: Rust, no_std, in wasm</text>
<rect class="host" x="236" y="42" width="150" height="50" rx="5"/>
<text x="311" y="62" text-anchor="middle">compiler</text>
<text class="small" x="311" y="78" text-anchor="middle">tokens to bytecode</text>
<rect class="host" x="410" y="42" width="150" height="50" rx="5"/>
<text x="485" y="62" text-anchor="middle">interpreter</text>
<text class="small" x="485" y="78" text-anchor="middle">fuel, no recursion</text>
<rect class="host" x="584" y="42" width="150" height="50" rx="5"/>
<text x="659" y="62" text-anchor="middle">copying GC</text>
<text class="small" x="659" y="78" text-anchor="middle">compacts the arena</text>

<!-- The arena -->
<rect class="arena" x="220" y="126" width="530" height="194" rx="8"/>
<g>
  <rect class="cell" x="236" y="140" width="118" height="50" rx="4"/>
  <text x="295" y="160" text-anchor="middle">pending host calls</text>
  <text class="small" x="295" y="177" text-anchor="middle">and the inbox</text>
  <rect class="cell" x="364" y="140" width="118" height="50" rx="4"/>
  <text x="423" y="160" text-anchor="middle">function templates</text>
  <text class="small" x="423" y="177" text-anchor="middle">bytecode, constants</text>
  <rect class="cell" x="492" y="140" width="118" height="50" rx="4"/>
  <text x="551" y="160" text-anchor="middle">value stack, frames</text>
  <text class="small" x="551" y="177" text-anchor="middle">every call</text>
  <rect class="cell" x="620" y="140" width="118" height="50" rx="4"/>
  <text x="679" y="160" text-anchor="middle">realm, builtins</text>
  <text class="small" x="679" y="177" text-anchor="middle">the base snapshot</text>
  <rect class="cell" x="236" y="200" width="118" height="50" rx="4"/>
  <text x="295" y="220" text-anchor="middle">job queue</text>
  <text class="small" x="295" y="237" text-anchor="middle">promise reactions</text>
  <rect class="cell" x="364" y="200" width="118" height="50" rx="4"/>
  <text x="423" y="220" text-anchor="middle">objects, strings</text>
  <text class="small" x="423" y="237" text-anchor="middle">shapes, ropes, arrays</text>
  <rect class="cell" x="492" y="200" width="118" height="50" rx="4"/>
  <text x="551" y="220" text-anchor="middle">atoms</text>
  <text class="small" x="551" y="237" text-anchor="middle">property keys</text>
  <rect class="cell" x="620" y="200" width="118" height="50" rx="4"/>
  <text x="679" y="220" text-anchor="middle">handles</text>
  <text class="small" x="679" y="237" text-anchor="middle">values the host holds</text>
</g>
<text class="title" x="485" y="282" text-anchor="middle">The arena: one byte array with all VM state, linked by u32 offsets</text>
<text class="small" x="485" y="300" text-anchor="middle">a snapshot is a copy of these bytes</text>

<!-- Flows -->
<path class="arrow" d="M168 84 C 200 84, 206 67, 234 67"/>
<path class="arrow" d="M330 92 L 405 138"/>
<path class="arrow" d="M505 92 L 545 138"/>
<path class="arrow" d="M234 160 L 170 147"/>
<text class="small" x="201" y="146" text-anchor="middle">calls</text>
<path class="arrow" d="M168 204 L 232 222"/>
<text class="small" x="196" y="204" text-anchor="middle">results</text>
<path class="arrow" d="M234 240 L 170 262"/>
<text class="small" x="204" y="264" text-anchor="middle">reads</text>
</svg>
