<svg class="dg-shapes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Two objects with the same keys share one shape chain; each has only its own values block">
<title>Two objects with the same keys share one shape chain; each has only its own values block</title>
<style>
  .dg-shapes text { font-family: var(--semantic-font-family-ui, "Mallos Serif", Georgia, serif); font-size: 12px; fill: var(--semantic-color-text-primary, #111111); }
  .dg-shapes .mono { font-family: var(--semantic-font-family-code, "Commit Mono", ui-monospace, Menlo, monospace); font-size: 11px; }
  .dg-shapes .small { font-size: 10.5px; fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-shapes .label { font-weight: 600; }
  .dg-shapes .title { font-weight: 600; font-size: 13px; }
  .dg-shapes .box, .dg-shapes .host { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); }
  .dg-shapes .hdr, .dg-shapes .engine { fill: var(--semantic-color-background-fill-secondary-information, #dbe4ea); stroke: var(--semantic-color-border-information, #3380a4); }
  .dg-shapes .traced, .dg-shapes .arena { fill: var(--semantic-color-background-fill-secondary-warning, #f3e0be); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-shapes .tag { fill: var(--semantic-color-background-fill-secondary-positive, #dae6df); stroke: var(--semantic-color-border-positive, #378960); }
  .dg-shapes .cell { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-warning, #996f00); }
  .dg-shapes .pad { fill: url(#shapes-hatch); stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  .dg-shapes .tail { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-shapes .zero { fill: var(--semantic-color-background-canvas, #f8f8f8); stroke: var(--semantic-color-border-primary, #777777); stroke-dasharray: 4 3; }
  .dg-shapes .dead { fill: var(--semantic-color-background-surface, #f1f1f1); stroke: var(--semantic-color-border-secondary, #e2e2e2); stroke-dasharray: 3 2; }
  .dg-shapes .opt { stroke-dasharray: 3 2; }
  .dg-shapes .rule { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; }
  .dg-shapes .dash { stroke: var(--semantic-color-text-secondary, #5e5e5e); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .dg-shapes .arrow { stroke: var(--semantic-color-text-secondary, #5e5e5e); fill: none; stroke-width: 1.3; marker-end: url(#shapes-a); }
  .dg-shapes .faint { stroke: var(--semantic-color-border-primary, #777777); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#shapes-a); }
  .dg-shapes .head { fill: var(--semantic-color-text-secondary, #5e5e5e); }
  .dg-shapes .hatch { stroke: var(--semantic-color-border-secondary, #e2e2e2); }
  @media (prefers-color-scheme: dark) {
    .dg-shapes text { fill: var(--semantic-color-text-primary, #f6f6f6); }
    .dg-shapes .small { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-shapes .box, .dg-shapes .host { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-shapes .hdr, .dg-shapes .engine { fill: var(--semantic-color-background-fill-secondary-information, #1e313b); stroke: var(--semantic-color-border-information, #4c9bc1); }
    .dg-shapes .traced, .dg-shapes .arena { fill: var(--semantic-color-background-fill-secondary-warning, #3b2b0c); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-shapes .tag { fill: var(--semantic-color-background-fill-secondary-positive, #1f3328); stroke: var(--semantic-color-border-positive, #4da578); }
    .dg-shapes .cell { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-warning, #b8880c); }
    .dg-shapes .pad { stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-shapes .tail { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-shapes .zero { fill: var(--semantic-color-background-canvas, #161616); stroke: var(--semantic-color-border-primary, #919191); }
    .dg-shapes .dead { fill: var(--semantic-color-background-surface, #2e2e2e); stroke: var(--semantic-color-border-secondary, #464646); }
    .dg-shapes .rule { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-shapes .dash { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-shapes .arrow { stroke: var(--semantic-color-text-secondary, #ababab); }
    .dg-shapes .faint { stroke: var(--semantic-color-border-primary, #919191); }
    .dg-shapes .head { fill: var(--semantic-color-text-secondary, #ababab); }
    .dg-shapes .hatch { stroke: var(--semantic-color-border-secondary, #464646); }
  }
</style>
<defs><pattern id="shapes-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern><marker id="shapes-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>

<!-- Objects -->
<text class="title" x="20" y="22">per object</text>
<rect class="cell" x="20" y="34" width="150" height="44" rx="4"/>
<text class="mono" x="32" y="52">Object</text>
<text class="small" x="32" y="68">PROPS: the values block</text>
<rect class="cell" x="20" y="164" width="150" height="44" rx="4"/>
<text class="mono" x="32" y="182">Object</text>
<text class="small" x="32" y="198">PROPS: the values block</text>

<rect class="arena" x="210" y="34" width="190" height="44" rx="4"/>
<text class="mono" x="222" y="52">PropValues</text>
<text class="mono small" x="222" y="68">SHAPE │ 1 │ "row 1"</text>
<rect class="arena" x="210" y="164" width="190" height="44" rx="4"/>
<text class="mono" x="222" y="182">PropValues</text>
<text class="mono small" x="222" y="198">SHAPE │ 2 │ "row 2"</text>
<path class="arrow" d="M170 56 L208 56"/>
<path class="arrow" d="M170 186 L208 186"/>

<!-- Shapes -->
<text class="title" x="450" y="22">shared, one chain per key sequence</text>
<rect class="engine" x="450" y="100" width="130" height="44" rx="4"/>
<text class="mono" x="462" y="118">Shape  COUNT 2</text>
<text class="small" x="462" y="134">last key: name</text>
<rect class="engine" x="450" y="190" width="130" height="44" rx="4"/>
<text class="mono" x="462" y="208">Shape  COUNT 1</text>
<text class="small" x="462" y="224">last key: id</text>
<rect class="engine" x="620" y="190" width="120" height="44" rx="4"/>
<text class="mono" x="632" y="208">root Shape</text>
<text class="small" x="632" y="224">Roots.ROOT_SHAPE</text>
<path class="arrow" d="M400 50 C 430 50, 440 90, 470 100"/>
<path class="arrow" d="M400 180 C 430 170, 440 150, 470 144"/>
<path class="arrow" d="M515 144 L515 188"/>
<text class="small" x="521" y="170">PARENT</text>
<path class="arrow" d="M580 212 L618 212"/>
<text class="small" x="584" y="228">PARENT</text>
<path class="faint" d="M670 190 C 660 160, 600 160, 574 188"/>
<text class="small" x="600" y="158">TRANSITIONS</text>

<!-- Descriptors -->
<rect class="host" x="450" y="250" width="290" height="30" rx="4"/>
<text class="mono small" x="462" y="269">DESCS: [2, id, flags, name, flags]  shared</text>
<path class="faint" d="M515 234 L515 248"/>
<text class="small" x="20" y="248">An object holds only its values; a property's slot is its descriptor's index.</text>
<text class="small" x="20" y="264">Adding a key moves the object to a child shape, found in the parent's</text>
<text class="small" x="20" y="280">sorted TRANSITIONS or created there.</text>
</svg>
